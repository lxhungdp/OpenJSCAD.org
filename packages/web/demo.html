<!DOCTYPE html>
<html  xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="JSCAD is an open source set of modular, browser and command line tools for creating parametric 2D and 3D CAD designs with JavaScript code."/>
    <!-- Avoid serving a stale HTML shell from disk cache while JS/CSS use ?v= below -->
    <meta http-equiv="Cache-Control" content="no-cache"/>

    <title>JSCAD - JavaScript CAD</title>

    <!-- CSS + bundle URLs get ?v= from dist/bundle-stamp.txt (written by `npm run build`). -->
    <link rel="shortcut icon" href="imgs/favicon.png" type="image/x-png">
    <style>
        body{
          height: 100%;
          min-height: 100%;
          min-width: 100%;
          margin: 0px;
          font-family: 'Open Sans', sans-serif;
        }
        noscript{
          text-align: center;
        }
        #jscad{
          width: 100%;
          height: 100%;
        }
      </style>
  </head>

  <body>
    <noscript>
      <h1>Please enable JavaScript to use this website</h1>
    </noscript>
    <div id='jscad'></div>
    <script language="javascript">
      (function () {
        function withV (href, v) {
          var sep = href.indexOf('?') >= 0 ? '&' : '?'
          return href + sep + 'v=' + encodeURIComponent(v)
        }
        function injectCss (href, v) {
          var l = document.createElement('link')
          l.rel = 'stylesheet'
          l.type = 'text/css'
          l.href = withV(href, v)
          document.head.appendChild(l)
        }
        function boot (v) {
          injectCss('./css/demo.css', v)
          injectCss('./css/structures-dock.css', v)
          injectCss('./css/selection-properties.css', v)
          var s = document.createElement('script')
          s.onload = function () {
            var el1 = document.getElementById('jscad')
            if (window.jscadWeb && el1) window.jscadWeb(el1, { name: 'jscad1' })
            window.addEventListener('beforeunload', function (event) {
              event.preventDefault()
              event.returnValue = ''
            })
          }
          s.src = withV('./dist/jscad-web.min.js', v)
          document.body.appendChild(s)
        }
        fetch('./dist/bundle-stamp.txt', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : '' })
          .then(function (t) { boot((t || '').trim() || String(Date.now())) })
          .catch(function () { boot(String(Date.now())) })
      })()
    </script>
  </body>
</html>
